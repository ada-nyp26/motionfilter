[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "motionfilter"
version = "0.1.0"
description = "A Python library for Kalman filtering, motion simulation, sensor fusion, and state estimation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas Pung", email = "nypung@outlook.com" }]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "flake8"]